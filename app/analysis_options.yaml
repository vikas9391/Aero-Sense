# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Existing screens use concise single-statement guards extensively. Keep
    # that established style consistent instead of making CI fail on style-only
    # diagnostics; compile errors and semantic analyzer errors remain enabled.
    curly_braces_in_flow_control_structures: false
