services:
  - type: web
    name: aero-sense-backend
    runtime: rust
    rootDir: backend
    plan: free
    buildCommand: cargo build --release
    startCommand: cargo run --release
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_SEED
        value: "false"
      - key: ALLOW_VERIFICATION_SIMULATION
        value: "false"
      - key: ALLOW_DEMO_SUPER_ADMIN_LOGIN
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
