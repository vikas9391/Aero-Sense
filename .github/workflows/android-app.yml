name: Flutter Android App

on:
  push:
    branches: [main, mobile-app]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project configuration
        run: |
          grep -q 'com.aerosense.mobile' android/app/build.gradle.kts
          grep -q 'android.permission.NFC' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/aerosense/mobile/MainActivity.kt

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aero-sense-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
