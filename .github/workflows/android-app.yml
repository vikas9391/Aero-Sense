name: Flutter Android App

on:
  push:
    branches: [mobile-app]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms android --project-name aero_sense_mobile --org com.aerosense --no-pub

      - name: Configure Android application id and NFC
        run: |
          sed -i 's/com\.aerosense\.aero_sense_mobile/com.aerosense.mobile/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aero-sense-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
