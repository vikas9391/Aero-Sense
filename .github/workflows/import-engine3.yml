name: Import Engine3 Cinematic Frames

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-engine3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import missing engine3 frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/public/cinematic/engine3
          base="https://raw.githubusercontent.com/PalnatiNiranjan/AeroX/main/frontend/public/cinematic/engine3"
          for i in $(seq -w 1 225); do
            curl -fsSL "$base/ezgif-frame-${i}.jpg" -o "frontend/public/cinematic/engine3/ezgif-frame-${i}.jpg"
          done
          test "$(find frontend/public/cinematic/engine3 -type f -name '*.jpg' | wc -l)" -eq 225

      - name: Commit imported frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/cinematic/engine3
          if git diff --cached --quiet; then
            echo "engine3 is already present"
            exit 0
          fi
          git commit -m "Add missing engine3 cinematic frames [skip ci]"
          git push
