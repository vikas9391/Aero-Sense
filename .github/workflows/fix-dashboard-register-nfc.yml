name: Fix dashboard labels and register NFC lifecycle

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-register-nfc.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix dashboard labels and register NFC lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          registration = Path('app/lib/registration_pages.dart')
          text = registration.read_text()
          old = '''  bool _handlingTag = false;\n  Timer? _readerStopTimer;\n  Component? boundComponent;'''
          new = '''  bool _handlingTag = false;\n  Timer? _readerStopTimer;\n  bool _routeInitialized = false;\n  Component? boundComponent;'''
          if old not in text:
              raise SystemExit('registration: state fields not found')
          text = text.replace(old, new, 1)

          old = '''  @override\n  void initState() {\n    super.initState();\n    final uri = GoRouterState.of(context).uri;\n    final initialUid = uri.queryParameters['uid'];\n    final initialComponent = uri.queryParameters['component'];\n    if (initialUid != null && initialUid.trim().isNotEmpty) identifier.text = initialUid.trim().toUpperCase();\n    if (initialComponent != null && int.tryParse(initialComponent) != null) componentId = initialComponent;\n    api.components().then((v) {\n      if (mounted) setState(() { components = v; loading = false; });\n    }).catchError((_) {\n      if (mounted) setState(() => loading = false);\n    });\n  }'''
          new = '''  @override\n  void initState() {\n    super.initState();\n    _loadComponents();\n  }\n\n  @override\n  void didChangeDependencies() {\n    super.didChangeDependencies();\n    if (_routeInitialized) return;\n    _routeInitialized = true;\n    final uri = GoRouterState.of(context).uri;\n    final initialUid = uri.queryParameters['uid'];\n    final initialComponent = uri.queryParameters['component'];\n    if (initialUid != null && initialUid.trim().isNotEmpty) identifier.text = initialUid.trim().toUpperCase();\n    if (initialComponent != null && int.tryParse(initialComponent) != null) componentId = initialComponent;\n  }\n\n  Future<void> _loadComponents() async {\n    try {\n      final value = await api.components();\n      if (mounted) setState(() { components = value; loading = false; });\n    } catch (_) {\n      if (mounted) setState(() => loading = false);\n    }\n  }'''
          if old not in text:
              raise SystemExit('registration: initState block not found')
          text = text.replace(old, new, 1)
          registration.write_text(text)

          dashboard = Path('app/lib/dashboard_page.dart')
          text = dashboard.read_text()
          old = '''  Widget _stat(double width, String label, int value, IconData icon) => SizedBox(\n        width: width,\n        height: 122,\n        child: CardBox(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n          Icon(icon, color: accent),\n          const Spacer(),\n          Text('$value', style: const TextStyle(fontSize: 27, fontWeight: FontWeight.w800)),\n          const SizedBox(height: 2),\n          Flexible(child: Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: muted))),\n        ])),\n      );'''
          new = '''  Widget _stat(double width, String label, int value, IconData icon) => SizedBox(\n        width: width,\n        height: 128,\n        child: CardBox(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n          Icon(icon, color: accent),\n          const Spacer(),\n          Text('$value', style: const TextStyle(fontSize: 27, fontWeight: FontWeight.w800)),\n          const SizedBox(height: 4),\n          Text(\n            label,\n            maxLines: 2,\n            softWrap: true,\n            overflow: TextOverflow.ellipsis,\n            style: const TextStyle(color: muted, fontSize: 12, height: 1.15),\n          ),\n        ])),\n      );'''
          if old not in text:
              raise SystemExit('dashboard: stat widget not found')
          text = text.replace(old, new, 1)
          dashboard.write_text(text)
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/registration_pages.dart app/lib/dashboard_page.dart
          git commit -m "Fix dashboard labels and register NFC lifecycle"
          git push
