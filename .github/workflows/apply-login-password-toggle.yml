name: Apply Login Password Toggle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update login password field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/screens.dart')
          text = path.read_text()
          old_state = "  bool busy = false;\n"
          new_state = "  bool busy = false;\n  bool showPassword = false;\n"
          if "bool showPassword = false;" not in text:
              text = text.replace(old_state, new_state, 1)
          old_field = "TextField(controller: password, obscureText: true, onSubmitted: (_) { if (!busy) go(); }, decoration: const InputDecoration(labelText: 'Password', prefixIcon: Icon(Icons.lock_outline))),"
          new_field = "TextField(controller: password, obscureText: !showPassword, onSubmitted: (_) { if (!busy) go(); }, decoration: InputDecoration(labelText: 'Password', prefixIcon: const Icon(Icons.lock_outline), suffixIcon: IconButton(onPressed: () => setState(() => showPassword = !showPassword), tooltip: showPassword ? 'Hide password' : 'Show password', icon: Icon(showPassword ? Icons.visibility_off_outlined : Icons.visibility_outlined)))),"
          if old_field not in text:
              raise SystemExit('Login password field pattern not found')
          text = text.replace(old_field, new_field, 1)
          path.write_text(text)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat: add login password visibility toggle"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-login-password-toggle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-login-password-toggle.yml
          git commit -m "chore: remove temporary login update workflow"
          git push
